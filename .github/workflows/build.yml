name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [8, 17]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Build and test
        run: ./mvnw -B clean verify

  release-profile:
    name: Release profile validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate release profile
        run: ./mvnw -B clean verify -Prelease -Dgpg.skip=true
